<!DOCTYPE html>
<html layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Staff Registration</title>
    <!-- Cropper.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css">
</head>
<body>
<section layout:fragment="content">

    <!-- Display Success Message -->
    <div th:if="${success}" class="alert alert-success">
        <p th:text="${success}"></p>
    </div>

    <!-- Display Error Message -->
    <div th:if="${error}" class="alert alert-danger">
        <p th:text="${error}"></p>
    </div>

    <!-- Top Bar -->
    <div class="row mb-4">
        <div class="col-6">
            <h2>Staff Registration</h2>
            <p class="text-muted">Register a new Staff member in the system.</p>
        </div>
        <div class="col-6 text-right">
            <button class="btn btn-primary" data-toggle="modal" data-target="#createBatchModal">Bulk Registration</button>
            <a href="javascript:history.back()" class="btn btn-secondary">Back</a>
        </div>
    </div>

    <!-- Staff Registration Form -->
    <div class="card">
        <div class="card-body">
            <h4 class="card-title mb-4">Register a New Staff Member</h4>
            <form th:action="@{/staff/employee-register}" th:object="${staffDTO}" method="post"
                  enctype="multipart/form-data">

                <!-- Image Upload and Preview -->
                <div class="form-group row">
                    <label class="col-sm-2 col-form-label">Profile Image</label>
                    <div class="col-sm-10">
                        <!-- Default Profile Image -->
                        <div class="upload-photo" style="margin-top: 10px;">
                            <img id="imagePreview" src="/images/employee-id/default-avatar.jpg" alt="Profile Image"
                                 class="img-thumbnail mb-2" style="width: 150px; height: 150px; object-fit: cover;">
                        </div>

                        <!-- Browse + Take Photo -->
                        <div class="d-flex gap-2 flex-wrap">
                            <input type="file" class="form-control" id="image" name="image" accept="image/*"
                                   onchange="handleImageUpload(event)" style="flex: 1; min-width: 200px;">
                            <button type="button" class="btn btn-primary" onclick="openCamera()">Take a Photo</button>
                        </div>

                        <!-- Hidden input to store cropped image data -->
                        <input type="hidden" id="croppedImageData" name="croppedImageData">
                    </div>
                </div>

                <!-- Title -->
                <div class="form-group row">
                    <label for="title" class="col-sm-2 col-form-label">Title</label>
                    <div class="col-sm-10">
                        <select class="form-control" id="title" name="title" th:field="*{title}" required>
                            <option value="">Select Title</option>
                            <option value="Mr.">Mr.</option>
                            <option value="Miss.">Miss.</option>
                            <option value="Dr.">Dr.</option>
                            <option value="Prof.">Prof.</option>
                        </select>
                    </div>
                </div>

                <!-- First Name -->
                <div class="form-group row">
                    <label for="firstName" class="col-sm-2 col-form-label">First Name</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="firstName" name="firstName"
                               th:field="*{firstName}" placeholder="Enter first name" required>
                    </div>
                </div>

                <!-- Last Name -->
                <div class="form-group row">
                    <label for="lastName" class="col-sm-2 col-form-label">Last Name</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="lastName" name="lastName"
                               th:field="*{lastName}" placeholder="Enter last name" required>
                    </div>
                </div>

                <!-- Employee Number -->
                <div class="form-group row">
                    <label for="regNo" class="col-sm-2 col-form-label">Emp No</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="regNo" name="regNo" th:field="*{empNo}"
                               placeholder="Enter registration number" required>
                    </div>
                </div>

                <!-- Qualification -->
                <div class="form-group row">
                    <label for="qualification" class="col-sm-2 col-form-label">Qualification</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="qualification" name="qualification"
                               th:field="*{qualification}" placeholder="Enter qualification" required>
                    </div>
                </div>

                <!-- Designation -->
                <div class="form-group row">
                    <label for="designation" class="col-sm-2 col-form-label">Designation</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="designation" name="designation"
                               th:field="*{designation}"
                               placeholder="Enter designation" required>
                    </div>
                </div>

                <!-- Phone Number -->
                <div class="form-group row">
                    <label for="phoneNumber" class="col-sm-2 col-form-label">Phone Number</label>
                    <div class="col-sm-10">
                        <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber"
                               th:field="*{phoneNumber}" placeholder="Enter 10 digit phone number" required>
                    </div>
                </div>

                <!-- Email Address -->
                <div class="form-group row">
                    <label for="email" class="col-sm-2 col-form-label">Email Address</label>
                    <div class="col-sm-10">
                        <input type="email" class="form-control" id="email" name="email"
                               th:field="*{email}" placeholder="Enter email address" required>
                    </div>
                </div>

                <!-- Staff Type -->
                <div class="form-group row">
                    <label for="staffType" class="col-sm-2 col-form-label">Staff Type</label>
                    <div class="col-sm-10">
                        <select class="form-control" id="staffType" name="staffTypeId" th:field="*{staffTypeId}"
                                onchange="toggleFacultyGroup()" required>
                            <option value="" disabled selected>Select Staff Type</option>
                            <option th:each="type : ${staffTypes}"
                                    th:value="${type.id}"
                                    th:text="${type.typeName}"
                                    th:data-isfaculty="${type.typeName == 'Academic' ? 'true' : 'false'}"></option>
                        </select>
                    </div>
                </div>

                <!-- Faculty -->
                <div class="form-group row" id="facultyGroup" style="display: none;">
                    <label for="faculty" class="col-sm-2 col-form-label">Faculty</label>
                    <div class="col-sm-10">
                        <select class="form-control" id="faculty" name="facultyId" th:field="*{facultyId}">
                            <option value="" disabled selected>Select Faculty</option>
                            <option th:each="faculty : ${faculties}"
                                    th:value="${faculty.id}"
                                    th:text="${faculty.displayName}"></option>
                        </select>
                    </div>
                </div>

                <!-- Department -->
                <div class="form-group row" id="departmentGroup">
                    <label for="department" class="col-sm-2 col-form-label">Department</label>
                    <div class="col-sm-10">
                        <select class="form-control" id="department" name="departmentId" th:field="*{departmentId}" required>
                            <option value="" disabled selected>Select Department</option>
                            <option th:each="dept : ${departments}"
                                    th:value="${dept.id}"
                                    th:text="${dept.displayName}"></option>
                        </select>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="form-group row mt-4">
                    <div class="col-sm-12 text-right">
                        <button type="submit" class="btn btn-success">Register Staff</button>
                        <a href="javascript:history.back()" class="btn btn-light">Cancel</a>
                    </div>
                </div>

            </form>
        </div>
    </div>

    <!-- Camera Capture Modal -->
    <div class="modal fade" id="cameraModal" tabindex="-1" role="dialog">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Take a Photo</h5>
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                </div>
                <div class="modal-body text-center">
                    <video id="camera" autoplay style="width: 100%; max-height: 300px;"></video>
                    <canvas id="canvas" style="display:none;"></canvas>
                    <button type="button" class="btn btn-success mt-2" onclick="capturePhoto()">Capture</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Image Editor Modal -->
    <div class="modal fade" id="imageEditorModal" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit Image</h5>
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-8">
                            <img id="cropperImage" style="max-width: 100%;">
                        </div>
                        <div class="col-md-4">
                            <h6>Crop Controls</h6>
                            <button type="button" class="btn btn-secondary btn-sm mb-1" onclick="cropperInstance.reset()">Reset</button>
                            <button type="button" class="btn btn-secondary btn-sm mb-1" onclick="cropperInstance.clear()">Clear</button>

                            <h6 class="mt-3">Rotation</h6>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="cropperInstance.rotate(-90)">↶ -90°</button>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="cropperInstance.rotate(90)">↷ 90°</button>

                            <h6 class="mt-3">Flip</h6>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="flipHorizontal()">↔ Horizontal</button>
                            <button type="button" class="btn btn-secondary btn-sm" onclick="flipVertical()">↕ Vertical</button>

                            <h6 class="mt-3">Aspect Ratio</h6>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="cropperInstance.setAspectRatio(1)">Square</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="cropperInstance.setAspectRatio(4/3)">4:3</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="cropperInstance.setAspectRatio(16/9)">16:9</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="cropperInstance.setAspectRatio(NaN)">Free</button>

                            <h6 class="mt-3">Preview</h6>
                            <div id="preview" style="width:100px; height:100px; border:1px solid #ccc; border-radius:50%;"></div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="applyCrop()">Apply Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Cropper.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>

    <!-- JS -->
    <script>
        let cropperInstance = null;
        let currentImageData = null;
        let scaleX = 1, scaleY = 1;
        let videoStream;

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    currentImageData = e.target.result;
                    updateImagePreview(currentImageData);
                    openImageEditor();
                }
                reader.readAsDataURL(file);
            }
        }

        function updateImagePreview(src) {
            document.getElementById('imagePreview').src = src;
        }

        function openImageEditor() {
            if (!currentImageData) return;
            const cropperImage = document.getElementById('cropperImage');
            cropperImage.src = currentImageData;

            if (cropperInstance) cropperInstance.destroy();

            $('#imageEditorModal').modal('show');
            $('#imageEditorModal').on('shown.bs.modal', function () {
                cropperInstance = new Cropper(cropperImage, {
                    aspectRatio: 1,
                    viewMode: 1,
                    autoCropArea: 0.8,
                    crop: updatePreview
                });
            });
        }

        function updatePreview() {
            if (!cropperInstance) return;
            const canvas = cropperInstance.getCroppedCanvas({width:100, height:100});
            document.getElementById('preview').style.backgroundImage = `url(${canvas.toDataURL()})`;
        }

        function flipHorizontal() {
            scaleX = -scaleX;
            cropperInstance.scaleX(scaleX);
        }

        function flipVertical() {
            scaleY = -scaleY;
            cropperInstance.scaleY(scaleY);
        }

        function applyCrop() {
            const canvas = cropperInstance.getCroppedCanvas({width:300, height:300});
            const croppedData = canvas.toDataURL('image/jpeg', 0.9);
            updateImagePreview(croppedData);
            document.getElementById('croppedImageData').value = croppedData;
            dataURLtoFile(croppedData, "cropped_image.jpg");
            $('#imageEditorModal').modal('hide');
        }

        $('#imageEditorModal').on('hidden.bs.modal', function () {
            if (cropperInstance) cropperInstance.destroy();
            cropperInstance = null;
            scaleX = 1; scaleY = 1;
        });

        function openCamera() {
            navigator.mediaDevices.getUserMedia({video: true})
                .then(stream => {
                    videoStream = stream;
                    document.getElementById('camera').srcObject = stream;
                    $('#cameraModal').modal('show');
                })
                .catch(() => alert("Camera not available"));
        }

        function capturePhoto() {
            const video = document.getElementById('camera');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const img = canvas.toDataURL('image/png');
            currentImageData = img;
            updateImagePreview(img);
            dataURLtoFile(img, "captured.png");
            videoStream.getTracks().forEach(track => track.stop());
            $('#cameraModal').modal('hide');
            openImageEditor();
        }

        function dataURLtoFile(dataURL, filename) {
            let arr = dataURL.split(','), mime = arr[0].match(/:(.*?);/)[1],
                bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);
            while(n--) u8arr[n] = bstr.charCodeAt(n);
            let file = new File([u8arr], filename, {type:mime});
            let fileInput = document.getElementById('image');
            let dt = new DataTransfer();
            dt.items.add(file);
            fileInput.files = dt.files;
        }
    </script>

</section>
</body>
</html>
