<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/print-id-front.css}">
    <title>Staff ID Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="id-card-container">
    <div th:each="employee : ${employees.content}">

        <!-- FRONT SIDE -->
        <div class="id-card front-card">
            <div class="photo">
                <img th:src="${employee.filePath} ?: '/images/employee-id/default-avatar.jpg'" alt="Staff Photo">
            </div>

            <!--
              Font size for name/designation is picked server-side from the text
              length (no JS). This has to be deterministic because the printing
              flow calls iframe.contentWindow.print() the instant the iframe
              finishes loading -- there's no reliable window to run a client-side
              "shrink to fit" script before that happens.
            -->
            <div class="info-block">
                <div class="name-text"
                     th:text="${employee.printedName}"
                     th:classappend="${#strings.length(employee.printedName) > 28} ? 'text-tiny' : (${#strings.length(employee.printedName) > 20} ? 'text-small' : '')">
                    Name
                </div>
                <div class="designation-text"
                     th:text="${employee.designation}"
                     th:classappend="${#strings.length(employee.designation) > 55} ? 'text-tiny' : (${#strings.length(employee.designation) > 36} ? 'text-small' : '')">
                    Designation
                </div>
                <div class="department-text"
                     th:text="${employee.departmentDisplayName}"
                     th:classappend="${#strings.length(employee.departmentDisplayName) > 50} ? 'text-tiny' : ''">
                    Department
                </div>
            </div>

            <div class="issue-date-text">
                Date of Issue: <span th:text="${#dates.format(employee.issueDate, 'dd/MM/yyyy')}"></span>
            </div>
        </div>

        <!-- BACK SIDE -->
        <div class="id-card back-card">
            <div class="qr-code">
                <img th:if="${employee.getQrBase64()}"
                     th:src="'data:image/png;base64,' + ${employee.getQrBase64()}"
                     alt="Staff QR Code">
            </div>
        </div>

    </div>
</div>
</body>
</html>
