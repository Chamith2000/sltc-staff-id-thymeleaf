<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/print-id-front.css}">
    <title>Staff ID Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="id-card-container">
    <div th:each="employee : ${employees.content}">

        <!-- FRONT SIDE -->
        <div class="id-card front-card">
            <div class="photo">
                <img th:src="${employee.filePath} ?: '/images/employee-id/default-avatar.jpg'" alt="Staff Photo">
            </div>

            <div class="info-block">
                <div class="name-text" th:text="${employee.printedName}">Name</div>
                <div class="designation-text" th:text="${employee.designation}">Designation</div>
                <div class="department-text" th:text="${employee.departmentDisplayName}">Department</div>
            </div>

            <div class="issue-date-text">
                Date of Issue: <span th:text="${#dates.format(employee.issueDate, 'dd/MM/yyyy')}"></span>
            </div>
        </div>

        <!-- BACK SIDE -->
        <div class="id-card back-card">
            <div class="qr-code">
                <img th:if="${employee.getQrBase64()}"
                     th:src="'data:image/png;base64,' + ${employee.getQrBase64()}"
                     alt="Staff QR Code">
            </div>
        </div>

    </div>
</div>

<!--
  Long names / designations don't all fit at one fixed font-size, so instead of
  guessing a size that breaks on longer text, we measure each line in the
  browser and shrink it (in small steps) until it actually fits the card width.
  Runs once per card after fonts/layout are ready.
-->
<script th:inline="none">
    (function () {
        // Shrinks font-size in small steps until the (single-line) text fits.
        // If it still doesn't fit once we hit the minimum readable size, we
        // fall back to letting it wrap onto a second line at that size,
        // rather than keep shrinking into unreadably tiny text.
        function shrinkToFit(el, minPx) {
            if (!el) return;
            var floor = minPx || 8;
            var size = parseFloat(window.getComputedStyle(el).fontSize);
            var guard = 0;
            while (el.scrollWidth > el.clientWidth && size > floor && guard < 40) {
                size -= 0.5;
                el.style.fontSize = size + 'px';
                guard++;
            }
            if (el.scrollWidth > el.clientWidth) {
                el.style.whiteSpace = 'normal';
                el.style.textOverflow = 'clip';
                el.style.wordBreak = 'break-word';
            }
        }

        function fitAllCards() {
            document.querySelectorAll('.id-card.front-card').forEach(function (card) {
                shrinkToFit(card.querySelector('.name-text'), 9);
                shrinkToFit(card.querySelector('.designation-text'), 6.5);
            });
        }

        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(fitAllCards).catch(fitAllCards);
        } else {
            fitAllCards();
        }
        // Safety net in case fonts resolve before layout has settled
        window.addEventListener('load', fitAllCards);
    })();
</script>
</body>
</html>
