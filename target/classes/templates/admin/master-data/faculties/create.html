<!DOCTYPE html>
<html layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Create Faculty</title>
</head>
<body>
<section layout:fragment="content">

    <!-- Display Error Message -->
    <div th:if="${error}" class="alert alert-danger">
        <p th:text="${error}"></p>
    </div>

    <!-- Top Bar -->
    <div class="row mb-4">
        <div class="col-6">
            <h2>Create Faculty</h2>
            <p class="text-muted">Add a new faculty to the system.</p>
        </div>
        <div class="col-6 text-right">
            <a th:href="@{/admin/master-data/faculties}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to Faculty List
            </a>
        </div>
    </div>

    <!-- Create Faculty Form -->
    <div class="row">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">Faculty Information</h4>
                    <form th:action="@{/admin/master-data/faculties/save}" th:object="${facultyDTO}" method="post">
                        
                        <div class="form-group row">
                            <label for="name" class="col-sm-3 col-form-label">Name *</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="name" th:field="*{name}" required>
                                <small class="form-text text-muted">Internal faculty name (e.g., ENG)</small>
                            </div>
                        </div>

                        <div class="form-group row">
                            <label for="displayName" class="col-sm-3 col-form-label">Display Name *</label>
                            <div class="col-sm-9">
                                <input type="text" class="form-control" id="displayName" th:field="*{displayName}" required>
                                <small class="form-text text-muted">User-friendly faculty name (e.g., Faculty of Engineering)</small>
                            </div>
                        </div>

                        <div class="form-group row">
                            <div class="col-sm-9 offset-sm-3">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save"></i> Save Faculty
                                </button>
                                <a th:href="@{/admin/master-data/faculties}" class="btn btn-secondary ml-2">
                                    <i class="fas fa-times"></i> Cancel
                                </a>
                            </div>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

</section>
</body>
</html>
