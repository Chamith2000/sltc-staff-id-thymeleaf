<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Sign Up - Staff ID Generate</title>
    <link rel="stylesheet" th:href="@{/vendors/css/vendor.bundle.base.css}">
    <link rel="stylesheet" th:href="@{/vendors/css/vendor.bundle.addons.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="shortcut icon" th:href="@{/images/favicon.ico}" />
    <style>
        .vh-100 {
            height: 100vh !important;
        }
        .logo img {
            max-width: 200px;
        }
        .app-name {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .app-description {
            font-size: 1rem;
            color: #6c757d;
        }
        .invalid-email {
            border-color: #dc3545 !important;
        }
        .email-validation-msg {
            color: #dc3545;
            font-size: 0.875em;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
<div class="container d-flex align-items-center justify-content-center vh-100">
    <div class="col-md-8">
        <!-- Company Logo -->
        <div class="text-center mb-4">
            <div class="logo">
                <img th:src="@{/images/logo-technology-campus.png}" alt="Company Logo" class="img-fluid">
            </div>
            <div class="app-name">Staff ID</div>
            <div class="app-description">Create your account to manage staff information</div>
        </div>

        <!-- Signup Card -->
        <div class="card shadow-sm">
            <div class="card-header text-center bg-success text-white">
                <h3>Sign Up</h3>
            </div>
            <div class="card-body">
                <!-- Display Error Message -->
                <div th:if="${error}" class="alert alert-danger">
                    <p th:text="${error}"></p>
                </div>

                <!-- Display Success Message -->
                <div th:if="${success}" class="alert alert-success">
                    <p th:text="${success}"></p>
                </div>

                <form method="post" th:action="@{/auth/signup}" th:object="${userSignup}">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group mb-3">
                                <label for="firstName" class="form-label">First Name *</label>
                                <input type="text" id="firstName" th:field="*{firstName}" class="form-control" 
                                       placeholder="Enter first name" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group mb-3">
                                <label for="lastName" class="form-label">Last Name *</label>
                                <input type="text" id="lastName" th:field="*{lastName}" class="form-control" 
                                       placeholder="Enter last name" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                            </div>
                        </div>
                    </div>


                    <div class="form-group mb-3">
                        <label for="email" class="form-label">Email Address *</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control" 
                               placeholder="Enter email (must end with @sltc.ac.lk)" required
                               onblur="validateEmail()">
                        <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        <div id="emailValidationMsg" class="email-validation-msg" style="display: none;">
                            Email must end with @sltc.ac.lk
                        </div>
                    </div>

                    <div class="form-group mb-3">
                        <label for="phoneNumber" class="form-label">Phone Number</label>
                        <input type="tel" id="phoneNumber" th:field="*{phoneNumber}" class="form-control" 
                               placeholder="Enter phone number (optional)">
                        <div class="text-danger" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                    </div>


                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group mb-3">
                                <label for="password" class="form-label">Password *</label>
                                <input type="password" id="password" th:field="*{password}" class="form-control" 
                                       placeholder="Enter password" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group mb-3">
                                <label for="confirmPassword" class="form-label">Confirm Password *</label>
                                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" 
                                       placeholder="Confirm password" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-success">Create Account</button>
                    </div>

                    <div class="text-center">
                        <p class="mb-0">Already have an account? 
                            <a href="/auth/login" class="text-primary">Login here</a>
                        </p>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center">
                <small class="text-muted">© 2025 SLTC Technology Campus</small>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript -->
<script th:src="@{/vendors/js/vendor.bundle.base.js}"></script>
<script th:src="@{/vendors/js/vendor.bundle.addons.js}"></script>
<script th:src="@{/js/off-canvas.js}"></script>
<script th:src="@{/js/misc.js}"></script>

<script>
    function validateEmail() {
        const emailInput = document.getElementById('email');
        const emailValidationMsg = document.getElementById('emailValidationMsg');
        const email = emailInput.value;
        
        if (email && !email.endsWith('@sltc.ac.lk')) {
            emailInput.classList.add('invalid-email');
            emailValidationMsg.style.display = 'block';
        } else {
            emailInput.classList.remove('invalid-email');
            emailValidationMsg.style.display = 'none';
        }
    }

    // Real-time email validation
    document.getElementById('email').addEventListener('input', function() {
        validateEmail();
    });
</script>
</body>
</html>
