<!DOCTYPE html>
<html layout:decorate="~{layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <title>Edit Employee</title>
    <!-- Cropper.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css">
</head>
<body>
<section layout:fragment="content">

    <!-- Display Success Message -->
    <div th:if="${success}" class="alert alert-success">
        <p th:text="${success}"></p>
    </div>

    <!-- Display Error Message -->
    <div th:if="${error}" class="alert alert-danger">
        <p th:text="${error}"></p>
    </div>

    <!-- Top Bar -->
    <div class="row mb-4">
        <div class="col-6">
            <h2>Edit Employee</h2>
            <p class="text-muted">Modify employee details and update the record.</p>
        </div>
        <div class="col-6 text-right">
            <a href="javascript:history.back()" class="btn btn-secondary">Back</a>
        </div>
    </div>

    <!-- Employee Edit Form -->
    <div class="card">
        <div class="card-body">
            <h4 class="card-title mb-4">Edit Employee Details</h4>
            <form th:action="@{/staff/update}" th:object="${employeeDTO}" method="post" enctype="multipart/form-data">

                <!-- Hidden ID Field -->
                <input type="hidden" th:field="*{id}"/>

                <!-- Image Upload and Preview -->
                <div class="form-group row">
                    <label class="col-sm-2 col-form-label">Profile Image</label>
                    <div class="col-sm-10">
                        <!-- Default Profile Image -->
                        <div class="upload-photo" style="margin-top: 10px;">
                            <img th:src="${employeeDTO.filePath} ?: '/images/employee-id/default-avatar.jpg'"
                                 id="imagePreview" src="/images/employee-id/default-avatar.jpg" alt="Profile Image"
                                 class="img-thumbnail mb-2" style="width: 150px; height: 150px; object-fit: cover;">
                        </div>

                        <!-- Buttons in a row -->
                        <div class="d-flex gap-2 flex-wrap">
                            <!-- Browse Button -->
                            <input type="file" class="form-control" id="image" name="image" accept="image/*"
                                   onchange="handleImageUpload(event)" style="flex: 1; min-width: 200px;">

                            <!-- Take Photo Button -->
                            <button type="button" class="btn btn-primary" onclick="openCamera()">Take a Photo</button>
                        </div>

                        <!-- Hidden input to store cropped image data -->
                        <input type="hidden" id="croppedImageData" name="croppedImageData">
                    </div>
                </div>

                <!-- Title -->
                <div class="form-group row">
                    <label for="title" class="col-sm-2 col-form-label">Title</label>
                    <div class="col-sm-10">
                        <select class="form-control" id="title" name="title" th:field="*{title}" required>
                            <option value="">Select Title (Optional)</option>
                            <option value="Mr.">Mr.</option>
                            <option value="Miss.">Miss.</option>
                            <option value="Dr.">Dr.</option>
                            <option value="Prof.">Prof.</option>
                        </select>
                    </div>
                </div>

                <!-- First Name -->
                <div class="form-group row">
                    <label for="firstName" class="col-sm-2 col-form-label">First Name</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="firstName" name="firstName"
                               th:field="*{firstName}" placeholder="Enter first name" required>
                    </div>
                </div>

                <!-- Last Name -->
                <div class="form-group row">
                    <label for="lastName" class="col-sm-2 col-form-label">Last Name</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="lastName" name="lastName"
                               th:field="*{lastName}" placeholder="Enter last name" required>
                    </div>
                </div>

                <!-- Employee Number -->
                <div class="form-group row">
                    <label for="regNo" class="col-sm-2 col-form-label">Emp No</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="regNo" name="regNo" th:field="*{empNo}"
                               placeholder="Enter registration number" required>
                    </div>
                </div>

                <!-- Qualification -->
                <div class="form-group row">
                    <label for="qualification" class="col-sm-2 col-form-label">Qualification</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="qualification" name="qualification"
                               th:field="*{qualification}" placeholder="Enter qualification" required>
                    </div>
                </div>

                <!-- Designation -->
                <div class="form-group row">
                    <label for="designation" class="col-sm-2 col-form-label">Designation</label>
                    <div class="col-sm-10">
                        <input type="text" class="form-control" id="designation" name="designation"
                               th:field="*{designation}"
                               placeholder="Enter designation" required>
                    </div>
                </div>

                <!-- Phone Number -->
                <div class="form-group row">
                    <label for="phoneNumber" class="col-sm-2 col-form-label">Phone Number</label>
                    <div class="col-sm-10">
                        <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber"
                               th:field="*{phoneNumber}" placeholder="Enter 10 digit phone number" required>
                    </div>
                </div>

                <!-- Email Address -->
                <div class="form-group row">
                    <label for="email" class="col-sm-2 col-form-label">Email Address</label>
                    <div class="col-sm-10">
                        <input type="email" class="form-control" id="email" name="email"
                               th:field="*{email}" placeholder="Enter email address" required>
                    </div>
                </div>

                <!-- Staff Type -->
                <div class="form-group row">
                    <label for="staffType" class="col-sm-2 col-form-label">Staff Type</label>
                    <div class="col-sm-10">
                        <select class="form-control" id="staffType" name="staffTypeId" th:field="*{staffTypeId}"
                                onchange="toggleFacultyGroup()" required>
                            <option value="" disabled>Select Staff Type</option>
                            <option th:each="type : ${staffTypes}"
                                    th:value="${type.id}"
                                    th:text="${type.typeName}"
                                    th:selected="${type.id == employeeDTO.staffTypeId}"
                                    th:data-isfaculty="${type.typeName == 'Academic' ? 'true' : 'false'}"></option>
                        </select>
                    </div>
                </div>

                <!-- Faculty -->
                <div class="form-group row" id="facultyGroup" style="display: none;">
                    <label for="faculty" class="col-sm-2 col-form-label">Faculty</label>
                    <div class="col-sm-10">
                        <select class="form-control" id="faculty" name="facultyId" th:field="*{facultyId}">
                            <option value="" disabled>Select Faculty</option>
                            <option th:each="faculty : ${faculties}"
                                    th:value="${faculty.id}"
                                    th:text="${faculty.displayName}"
                                    th:selected="${faculty.id == employeeDTO.facultyId}"></option>
                        </select>
                    </div>
                </div>

                <!-- Department -->
                <div class="form-group row" id="departmentGroup">
                    <label for="department" class="col-sm-2 col-form-label">Department</label>
                    <div class="col-sm-10">
                        <select class="form-control" id="department" name="departmentId" th:field="*{departmentId}"
                                required>
                            <option value="" disabled>Select Department</option>
                            <option th:each="dept : ${departments}"
                                    th:value="${dept.id}"
                                    th:text="${dept.displayName}"
                                    th:selected="${dept.id == employeeDTO.departmentId}"></option>
                        </select>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="form-group row mt-4">
                    <div class="col-sm-12 text-right">
                        <button type="submit" class="btn btn-success">Update Employee</button>
                        <a href="javascript:history.back()" class="btn btn-light">Cancel</a>
                    </div>
                </div>

            </form>
        </div>
    </div>

    <!-- Camera Capture Modal -->
    <div class="modal fade" id="cameraModal" tabindex="-1" role="dialog" aria-labelledby="cameraModalLabel"
         aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Take a Photo</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body text-center">
                    <video id="camera" autoplay style="width: 100%; max-height: 300px;"></video>
                    <canvas id="canvas" style="display:none;"></canvas>
                    <button type="button" class="btn btn-success mt-2" onclick="capturePhoto()">Capture</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Image Editor Modal -->
    <div class="modal fade" id="imageEditorModal" tabindex="-1" role="dialog" aria-labelledby="imageEditorModalLabel"
         aria-hidden="true" data-backdrop="static" data-keyboard="false">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit and Crop Image</h5>
                    <small class="text-muted ml-2">Adjust the image before saving</small>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-8">
                            <div class="cropper-container">
                                <img id="cropperImage" style="max-width: 100%;">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <h6>Crop Controls</h6>
                            <div class="btn-group-vertical d-block mb-3">
                                <button type="button" class="btn btn-secondary btn-sm mb-1" onclick="cropperInstance.reset()">Reset</button>
                                <button type="button" class="btn btn-secondary btn-sm mb-1" onclick="cropperInstance.clear()">Clear</button>
                            </div>

                            <h6>Rotation</h6>
                            <div class="btn-group mb-3">
                                <button type="button" class="btn btn-secondary btn-sm" onclick="cropperInstance.rotate(-90)">↶ -90°</button>
                                <button type="button" class="btn btn-secondary btn-sm" onclick="cropperInstance.rotate(90)">↷ 90°</button>
                            </div>

                            <h6>Flip</h6>
                            <div class="btn-group mb-3">
                                <button type="button" class="btn btn-secondary btn-sm" onclick="flipHorizontal()">↔ Horizontal</button>
                                <button type="button" class="btn btn-secondary btn-sm" onclick="flipVertical()">↕ Vertical</button>
                            </div>

                            <h6>Aspect Ratio</h6>
                            <div class="btn-group-vertical d-block mb-3">
                                <button type="button" class="btn btn-outline-secondary btn-sm mb-1" onclick="cropperInstance.setAspectRatio(1)">Square</button>
                                <button type="button" class="btn btn-outline-secondary btn-sm mb-1" onclick="cropperInstance.setAspectRatio(4/3)">4:3</button>
                                <button type="button" class="btn btn-outline-secondary btn-sm mb-1" onclick="cropperInstance.setAspectRatio(16/9)">16:9</button>
                                <button type="button" class="btn btn-outline-secondary btn-sm mb-1" onclick="cropperInstance.setAspectRatio(NaN)">Free</button>
                            </div>

                            <h6>Preview</h6>
                            <div class="preview-container">
                                <div id="preview" style="width: 100px; height: 100px; border: 1px solid #ccc; overflow: hidden; border-radius: 50%;"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="skipEditing()">Skip Editing</button>
                    <button type="button" class="btn btn-primary" onclick="applyCrop()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CSS Styles -->
    <style>
        .form-group.row {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }

        .form-group.row .col-sm-2,
        .form-group.row .col-sm-10 {
            padding: 0 15px;
        }

        .preview-container {
            margin-top: 10px;
        }

        #preview {
            background-color: #f8f9fa;
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }

        .cropper-container {
            max-height: 400px;
        }

        .modal-backdrop.show {
            opacity: 0.8;
        }
    </style>

    <!-- Cropper.js JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>

    <!-- All JavaScript Functions -->
    <script>
        // Global variables
        let cropperInstance = null;
        let currentImageData = null;
        let scaleX = 1;
        let scaleY = 1;
        let videoStream;

        // Department and faculty toggle functions
        function toggleFacultyGroup() {
            console.log('toggleFacultyGroup called');
            const staffTypeSelect = document.getElementById('staffType');
            const facultyGroup = document.getElementById('facultyGroup');
            const departmentSelect = document.getElementById('department');
            const selectedOption = staffTypeSelect.options[staffTypeSelect.selectedIndex];

            console.log('Selected option:', selectedOption ? selectedOption.text : 'None');
            console.log('data-isfaculty:', selectedOption ? selectedOption.getAttribute('data-isfaculty') : 'None');

            const isFaculty = selectedOption ? selectedOption.getAttribute('data-isfaculty') === 'true' : false;

            if (facultyGroup) {
                console.log('Setting facultyGroup display to:', isFaculty ? 'flex' : 'none');
                facultyGroup.style.display = isFaculty ? 'flex' : 'none';
            } else {
                console.log('facultyGroup not found in DOM');
            }

            const facultySelect = document.getElementById('faculty');
            if (!isFaculty && facultySelect) {
                facultySelect.value = '';
                console.log('Faculty selection reset');
            }

            if (selectedOption && selectedOption.value) {
                fetchDepartments(selectedOption.value);
            } else {
                updateDepartmentOptions([]);
            }
        }

        function fetchDepartments(staffTypeId) {
            console.log('Fetching departments for staffTypeId:', staffTypeId);
            fetch(`/admin/master-data/departments?staffTypeId=${staffTypeId}`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to fetch departments');
                    }
                    return response.json();
                })
                .then(departments => {
                    console.log('Departments received:', departments);
                    updateDepartmentOptions(departments);
                })
                .catch(error => {
                    console.error('Error fetching departments:', error);
                    updateDepartmentOptions([]);
                });
        }

        function updateDepartmentOptions(departments) {
            const departmentSelect = document.getElementById('department');
            const currentDepartmentId = departmentSelect.value;

            departmentSelect.innerHTML = '<option value="" disabled>Select Department</option>';

            departments.forEach(dept => {
                const option = document.createElement('option');
                option.value = dept.id;
                option.text = dept.displayName;
                if (dept.id == currentDepartmentId) {
                    option.selected = true;
                }
                departmentSelect.appendChild(option);
            });

            console.log('Department options updated');
        }

        // Image handling functions - Auto opens editor after image selection
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    currentImageData = e.target.result;
                    // Automatically open image editor after image is loaded
                    setTimeout(() => {
                        openImageEditor();
                    }, 100);
                }
                reader.readAsDataURL(file);
            }
        }

        function updateImagePreview(imageSrc) {
            const imagePreview = document.getElementById('imagePreview');
            imagePreview.src = imageSrc;
            imagePreview.style.display = 'block';
        }

        function openImageEditor() {
            if (!currentImageData) {
                const existingImage = document.getElementById('imagePreview');
                if (existingImage && existingImage.src && !existingImage.src.includes('default-avatar.jpg')) {
                    currentImageData = existingImage.src;
                } else {
                    alert('Please upload or capture an image first.');
                    return;
                }
            }

            const cropperImage = document.getElementById('cropperImage');
            cropperImage.src = currentImageData;

            if (cropperInstance) {
                cropperInstance.destroy();
            }

            $('#imageEditorModal').modal('show');

            $('#imageEditorModal').on('shown.bs.modal', function () {
                cropperInstance = new Cropper(cropperImage, {
                    aspectRatio: 1,
                    viewMode: 1,
                    dragMode: 'move',
                    autoCropArea: 0.8,
                    restore: false,
                    guides: true,
                    center: true,
                    highlight: false,
                    cropBoxMovable: true,
                    cropBoxResizable: true,
                    toggleDragModeOnDblclick: false,
                    ready: function () {
                        updatePreview();
                    },
                    crop: function () {
                        updatePreview();
                    }
                });
            });
        }

        function updatePreview() {
            if (!cropperInstance) return;

            const canvas = cropperInstance.getCroppedCanvas({
                width: 100,
                height: 100
            });

            const preview = document.getElementById('preview');
            preview.style.backgroundImage = `url(${canvas.toDataURL()})`;
        }

        function flipHorizontal() {
            if (cropperInstance) {
                scaleX = -scaleX;
                cropperInstance.scaleX(scaleX);
            }
        }

        function flipVertical() {
            if (cropperInstance) {
                scaleY = -scaleY;
                cropperInstance.scaleY(scaleY);
            }
        }

        function applyCrop() {
            if (!cropperInstance) return;

            const canvas = cropperInstance.getCroppedCanvas({
                width: 300,
                height: 300,
                imageSmoothingQuality: 'high'
            });

            const croppedImageData = canvas.toDataURL('image/jpeg', 0.9);

            updateImagePreview(croppedImageData);
            document.getElementById('croppedImageData').value = croppedImageData;
            dataURLtoFile(croppedImageData, "cropped_image.jpg");

            $('#imageEditorModal').modal('hide');
        }

        // New function to skip editing and use original image
        function skipEditing() {
            if (currentImageData) {
                updateImagePreview(currentImageData);
                // Create a file from the original image data for form submission
                dataURLtoFile(currentImageData, "original_image.jpg");
            }
            $('#imageEditorModal').modal('hide');
        }

        // Camera functions - Auto opens editor after photo capture
        function openCamera() {
            navigator.mediaDevices.getUserMedia({video: true})
                .then(stream => {
                    videoStream = stream;
                    document.getElementById('camera').srcObject = stream;
                    $('#cameraModal').modal('show');
                })
                .catch(error => {
                    alert("Camera access denied or not available.");
                    console.error(error);
                });
        }

        function capturePhoto() {
            const video = document.getElementById('camera');
            const canvas = document.getElementById('canvas');
            const context = canvas.getContext('2d');

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageDataURL = canvas.toDataURL('image/png');

            currentImageData = imageDataURL;

            videoStream.getTracks().forEach(track => track.stop());
            $('#cameraModal').modal('hide');

            // Automatically open image editor after photo capture
            setTimeout(() => {
                openImageEditor();
            }, 500);
        }

        // Utility functions
        function dataURLtoFile(dataURL, filename) {
            let arr = dataURL.split(','), mime = arr[0].match(/:(.*?);/)[1],
                bstr = atob(arr[1]), n = bstr.length, u8arr = new Uint8Array(n);

            while (n--) {
                u8arr[n] = bstr.charCodeAt(n);
            }

            let file = new File([u8arr], filename, {type: mime});

            let fileInput = document.getElementById('image');
            let dataTransfer = new DataTransfer();
            dataTransfer.items.add(file);
            fileInput.files = dataTransfer.files;
        }

        // Event handlers
        $('#imageEditorModal').on('hidden.bs.modal', function () {
            if (cropperInstance) {
                cropperInstance.destroy();
                cropperInstance = null;
            }
            scaleX = 1;
            scaleY = 1;
        });

        // Page initialization
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Page loaded, initializing toggleFacultyGroup');
            toggleFacultyGroup();

            const existingImage = document.getElementById('imagePreview');
            if (existingImage && existingImage.src && !existingImage.src.includes('default-avatar.jpg')) {
                currentImageData = existingImage.src;
            }
        });
    </script>

</section>
</body>
</html>
